# Application configuration for MD Aesthetics AI Assistant
server.port=8080
spring.application.name=md-aesthetics-ai

# Firebase Configuration
firebase.project-id=${FIREBASE_PROJECT_ID:md-aesthetics-ai}
firebase.service-account-key=${FIREBASE_SERVICE_ACCOUNT_KEY:}

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.email.recipient=${EMAIL_RECIPIENT:info@mdaesthetics.ca}
app.email.from=${EMAIL_FROM:noreply@mdaesthetics.ca}

# Security Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Logging Configuration
logging.level.com.google.adk=DEBUG
logging.level.org.springframework.security=DEBUG

# Scheduling Configuration
spring.task.scheduling.pool.size=5

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,https://md-aesthetics-ai.web.app}

# Static Resources
spring.web.resources.static-locations=classpath:/browser/

# Actuator Configuration  
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always