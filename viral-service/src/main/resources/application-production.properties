# Production configuration - uses Google Cloud Secret Manager
# This profile is activated when deployed to Google Cloud

# Production Firebase configuration (uses Google Cloud defaults)
firebase.project-id=${GOOGLE_CLOUD_PROJECT:contentforge-ai-ygy25}

# Production Cloud Function endpoints  
scraping.cloud-function.url=https://us-central1-contentforge-ai-ygy25.cloudfunctions.net/viralScraper

# Production email configuration
email.enabled=true
email.daily-digest.enabled=true

# Production logging (less verbose)
logging.level.com.mdaesthetics.viral=INFO
logging.level.root=WARN

# Production Pub/Sub configuration
pubsub.project-id=${GOOGLE_CLOUD_PROJECT:contentforge-ai-ygy25}

# Production social media endpoints
social.tiktok.api-base-url=https://open.tiktokapis.com
social.instagram.graph-api-url=https://graph.instagram.com