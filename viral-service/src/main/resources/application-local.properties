# Local development configuration - uses .env file values
# This profile is active by default and uses environment variables from .env

# Local Firebase configuration (from .env)
firebase.project-id=${FIREBASE_PROJECT_ID:contentforge-ai-ygy25}
firebase.api-key=${FIREBASE_API_KEY:}
firebase.auth-domain=${FIREBASE_AUTH_DOMAIN:contentforge-ai-ygy25.firebaseapp.com}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:contentforge-ai-ygy25.firebasestorage.app}

# Local GenAI configuration (uses OPENROUTER_API_KEY from .env)
genai.api.key=${OPENROUTER_API_KEY:}

# Local service account (from .env)
google.application.credentials=${GOOGLE_APPLICATION_CREDENTIALS:service-account.json}

# For local development, use emulator endpoints if needed
scraping.cloud-function.url=${SCRAPING_FUNCTION_URL:http://localhost:5001/contentforge-ai-ygy25/us-central1/viralScraper}

# Local email configuration (simulation mode)
email.enabled=false
email.daily-digest.enabled=false

# Debug logging for local development
logging.level.com.mdaesthetics.viral=DEBUG
logging.level.com.google.adk=DEBUG