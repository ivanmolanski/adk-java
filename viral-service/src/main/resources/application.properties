server.port=3453
server.servlet.context-path=/viral-service
spring.application.name=viral-service
spring.main.allow-bean-definition-overriding=true
logging.level.com.mdaesthetics.viral=DEBUG
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Firestore configuration
google.project.id=${GOOGLE_CLOUD_PROJECT:contentforge-ai-ygy25}

# Local development profile configuration
spring.profiles.active=local

# GenAI configuration 
# For local development: uses GEMINI_API_KEY from .env file
# For production: LlmAgentConfig retrieves from Google Secret Manager
genai.api.model=gemini-2.5-flash

# Viral Forge System Configuration  
# Scraping Cloud Function (deployed Firebase Function)
scraping.cloud-function.url=${SCRAPING_FUNCTION_URL:https://us-central1-contentforge-ai-ygy25.cloudfunctions.net/viralScraper}
scraping.enabled=${SCRAPING_ENABLED:true}

# Pub/Sub Configuration
pubsub.project-id=${GOOGLE_CLOUD_PROJECT:contentforge-ai-ygy25}
pubsub.analyze-new-post-topic=${PUBSUB_ANALYZE_TOPIC:analyze-new-post}
pubsub.daily-digest-topic=${PUBSUB_DIGEST_TOPIC:daily-digest}
pubsub.subscription-name=${PUBSUB_SUBSCRIPTION:viral-analysis-subscription}

# Email Dispatch Configuration
email.enabled=${EMAIL_ENABLED:true}
email.daily-digest.enabled=${DAILY_DIGEST_ENABLED:true}
email.daily-digest.recipients=${DIGEST_RECIPIENTS:christine.carrer@hotmail.com,dalkeith@golden.net}
email.daily-digest.schedule=${DIGEST_SCHEDULE:0 0 8 * * ?}
email.sender=${EMAIL_SENDER:noreply@mdaesthetics.ca}

# Gmail API Configuration (for email dispatch) - uses Firebase Secret Manager
gmail.service-account-key=${GMAIL_SERVICE_ACCOUNT_KEY:}
gmail.application-name=MD-Aesthetics-Viral-Forge

# Firebase Configuration - uses Firebase Secrets for production
firebase.project-id=${FIREBASE_PROJECT_ID:contentforge-ai-ygy25}
firebase.api-key=${FIREBASE_API_KEY:AIzaSyAPDjj37OF9fdO2nsq2Qezwea-xGfPJRlA}
firebase.auth-domain=${FIREBASE_AUTH_DOMAIN:contentforge-ai-ygy25.firebaseapp.com}
firebase.database-url=${FIREBASE_DATABASE_URL:}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:contentforge-ai-ygy25.firebasestorage.app}

# Competitor Scraping Configuration
scraping.max-posts-per-account=${MAX_POSTS_PER_ACCOUNT:20}
scraping.max-accounts-per-run=${MAX_ACCOUNTS_PER_RUN:5}
scraping.rate-limit-delay=${RATE_LIMIT_DELAY:2000}

# Content Quality Thresholds
content.virality-score.minimum=${VIRALITY_SCORE_MIN:6}
content.relevance-score.minimum=${RELEVANCE_SCORE_MIN:7}
content.engagement-rate.minimum=${ENGAGEMENT_RATE_MIN:0.03}

# Social Media OAuth2 Configuration
social.tiktok.client-id=${TIKTOK_CLIENT_ID:your-tiktok-client-id}
social.tiktok.client-secret=${TIKTOK_CLIENT_SECRET:your-tiktok-client-secret}
social.instagram.client-id=${INSTAGRAM_CLIENT_ID:your-instagram-client-id}
social.instagram.client-secret=${INSTAGRAM_CLIENT_SECRET:your-instagram-client-secret}

# Application Base URL for OAuth2 redirects
app.base-url=${APP_BASE_URL:http://localhost:3453}

# Social Media API Configuration
social.tiktok.api-base-url=https://open.tiktokapis.com
social.instagram.graph-api-url=https://graph.instagram.com
social.instagram.api-version=v18.0

# Spring Security OAuth2
spring.security.oauth2.client.registration.tiktok.client-id=${social.tiktok.client-id}
spring.security.oauth2.client.registration.tiktok.client-secret=${social.tiktok.client-secret}
spring.security.oauth2.client.registration.tiktok.scope=user.info.basic,video.upload,video.publish
spring.security.oauth2.client.registration.tiktok.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.tiktok.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.registration.instagram.client-id=${social.instagram.client-id}
spring.security.oauth2.client.registration.instagram.client-secret=${social.instagram.client-secret}
spring.security.oauth2.client.registration.instagram.scope=user_profile,user_media
spring.security.oauth2.client.registration.instagram.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.instagram.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.tiktok.authorization-uri=https://www.tiktok.com/v2/auth/authorize/
spring.security.oauth2.client.provider.tiktok.token-uri=https://open.tiktokapis.com/v2/oauth/token/
spring.security.oauth2.client.provider.tiktok.user-info-uri=https://open.tiktokapis.com/v2/user/info/
spring.security.oauth2.client.provider.tiktok.user-name-attribute=data.user.display_name

spring.security.oauth2.client.provider.instagram.authorization-uri=https://api.instagram.com/oauth/authorize
spring.security.oauth2.client.provider.instagram.token-uri=https://api.instagram.com/oauth/access_token
spring.security.oauth2.client.provider.instagram.user-info-uri=https://graph.instagram.com/me
spring.security.oauth2.client.provider.instagram.user-name-attribute=username